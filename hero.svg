<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#0b0b14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 17px; }
    .p { fill: #22d3ee; font-weight: 700; }
    .c { fill: #e5e7eb; }
    .o { fill: #9ca3af; }
    .hi { fill: #a78bfa; font-weight: 700; }
    .pk { fill: #f472b6; }
    .gr { fill: #4ade80; }
    .yl { fill: #facc15; }
    .bar { font-size: 13px; fill: #6b7280; }
    .type { animation: type .9s steps(16) forwards, gone .01s forwards; }
    .out { opacity: 0; animation: show .4s ease forwards; }
    .cursor { animation: blink 1s step-end infinite; }
    .spin { transform-origin: 430px 165px; animation: hue 6s linear infinite; }
    @keyframes type { to { transform: translateX(200px); } }
    @keyframes gone { to { opacity: 0; } }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes hue { to { filter: hue-rotate(360deg); } }
  </style>

  <!-- window -->
  <rect class="spin" x="3" y="3" width="854" height="324" rx="16" fill="none" stroke="url(#border)" stroke-width="2.5"/>
  <rect x="5" y="5" width="850" height="320" rx="14" fill="#0b0b14"/>
  <rect x="5" y="5" width="850" height="320" rx="14" fill="url(#glow)"/>
  <circle cx="30" cy="28" r="6.5" fill="#ff5f57"/>
  <circle cx="52" cy="28" r="6.5" fill="#febc2e"/>
  <circle cx="74" cy="28" r="6.5" fill="#28c840"/>
  <text class="bar" x="430" y="33" text-anchor="middle">devansh@nxtjob — zsh — 86×14</text>

  <!-- line 1: whoami -->
  <text x="30" y="78"><tspan class="p">➜ ~</tspan><tspan class="c"> whoami</tspan></text>
  <rect class="type" x="72" y="62" width="200" height="22" fill="#0b0b14" style="animation-delay:.4s, 1.3s"/>
  <text class="out" x="30" y="106" style="animation-delay:1.5s"><tspan class="hi">Devansh Lodhi</tspan><tspan class="o"> · web developer @ </tspan><tspan class="pk">NxtJob.ai</tspan><tspan class="o"> · India 🇮🇳</tspan></text>

  <!-- line 2: ls -->
  <text x="30" y="146"><tspan class="p">➜ ~</tspan><tspan class="c"> ls ./shipping</tspan></text>
  <rect class="type" x="72" y="130" width="200" height="22" fill="#0b0b14" style="animation-delay:2.1s, 3s"/>
  <text class="out" x="30" y="174" style="animation-delay:3.2s"><tspan class="gr">resume-builder/</tspan><tspan class="yl">   chrome-autofill/</tspan><tspan class="pk">   erp/</tspan><tspan class="hi">   community/</tspan></text>

  <!-- line 3: cat -->
  <text x="30" y="214"><tspan class="p">➜ ~</tspan><tspan class="c"> cat ./mission.txt</tspan></text>
  <rect class="type" x="72" y="198" width="200" height="22" fill="#0b0b14" style="animation-delay:3.8s, 4.7s"/>
  <text class="out" x="30" y="242" style="animation-delay:4.9s"><tspan class="c">make applying for a job take </tspan><tspan class="gr">one click</tspan><tspan class="c">, not forty.</tspan></text>

  <!-- prompt -->
  <g class="out" style="animation-delay:5.5s">
    <text x="30" y="290"><tspan class="p">➜ ~</tspan></text>
    <rect class="cursor" x="78" y="275" width="10" height="20" fill="#a78bfa"/>
  </g>
</svg>
